name: SDK
# Every job runs on every change: the SDK has no RTL jobs to skip, and its
# full run takes a few minutes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    name: API snapshot and hardware lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Public API snapshot (Python, kagura_audio, C headers)
        run: python3 -I tools/api-snapshot.py --check
      - name: Generated constants against siska-tech/kagura at hardware.lock
        run: bash tools/check-hardware-lock.sh
      - name: Compile the generated C header
        run: bash tools/test-headers.sh
  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MicroPython
        run: |
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
      - name: Driver, terminal and actual PIO assembly/timing tests
        run: python3 -I software/micropython/tests/test_driver.py --rp2 build/micropython-src/ports/rp2/modules/rp2.py
      - name: Tile framebuffer raster and failure recovery
        run: python3 -I software/micropython/tests/test_framebuffer.py
      - name: Tile plane for native renderers (kagura-desktop)
        run: python3 -I software/micropython/tests/test_tileplane.py
      - name: KAGURA-UI ownership, input, reference pixels and recovery
        run: |
          python3 -I software/micropython/tests/test_ui.py
          python3 -I software/micropython/tests/test_frozen_alignment.py
          python3 -I tools/compare-ui-damage.py
      - name: KAGURA-UI CPython versus MicroPython v1.26 runtime
        run: |
          make -C build/micropython-src/mpy-cross -j4
          make -C build/micropython-src/ports/unix VARIANT=standard MICROPY_PY_SSL=0 MICROPY_PY_BTREE=0 MICROPY_PY_FFI=0 FROZEN_MANIFEST= -j4
          python3 software/micropython/tests/ui_runtime.py software/micropython/fonts/misaki8.kfnt > build/ui-cpython.txt
          MICROPYPATH=software/micropython build/micropython-src/ports/unix/build-standard/micropython software/micropython/tests/ui_runtime.py software/micropython/fonts/misaki8.kfnt > build/ui-micropython.txt
          diff -u build/ui-cpython.txt build/ui-micropython.txt
          python3 software/micropython/tests/ui_glyph_runtime.py > build/glyph-cpython.txt
          MICROPYPATH=software/micropython build/micropython-src/ports/unix/build-standard/micropython software/micropython/tests/ui_glyph_runtime.py > build/glyph-micropython.txt
          diff -u build/glyph-cpython.txt build/glyph-micropython.txt
          python3 software/micropython/tests/ui_canvas_runtime.py > build/canvas-cpython.txt
          MICROPYPATH=software/micropython build/micropython-src/ports/unix/build-standard/micropython software/micropython/tests/ui_canvas_runtime.py > build/canvas-micropython.txt
          diff -u build/canvas-cpython.txt build/canvas-micropython.txt
          python3 software/micropython/tests/ui_sprite_editor_runtime.py software/micropython/fonts/misaki8.kfnt > build/sprite-editor-cpython.txt
          MICROPYPATH=software/micropython:software/micropython/examples build/micropython-src/ports/unix/build-standard/micropython software/micropython/tests/ui_sprite_editor_runtime.py software/micropython/fonts/misaki8.kfnt > build/sprite-editor-micropython.txt
          diff -u build/sprite-editor-cpython.txt build/sprite-editor-micropython.txt
          MICROPYPATH=software/micropython build/micropython-src/ports/unix/build-standard/micropython software/micropython/tests/ui_focus_alloc.py
      - name: Audio HAL, KSNG player and binding
        run: bash software/audio/tools/test.sh
      - name: Numerical hardware fixture contracts
        run: python3 -I software/micropython/tests/test_tile1200_accept.py
      - name: Transport benchmark stimulus contracts
        run: python3 -I software/micropython/tests/test_transport_benchmark.py
      - name: STAR RUNNER game, audio, asset and telemetry tests
        run: python3 -I software/micropython/tests/test_shooter.py
      - name: Run the Viper link kernels against the register model
        run: python3 -I software/micropython/tests/test_link.py
      - name: Cherry-blossom showcase against the C stress demo's output
        run: python3 -I software/micropython/tests/test_sakura.py
      - name: Live presentation assets, COPY and chapter lifecycle
        run: python3 -I software/micropython/tests/test_showcase.py
      - name: STARFALL MicroPython versus original C game
        run: python3 -I software/micropython/tests/test_starfall.py
      - name: Japanese text tests and font regeneration
        run: |
          curl -fsSL -o build/misaki_bdf_2021-05-05.zip https://littlelimit.net/arc/misaki/misaki_bdf_2021-05-05.zip
          MISAKI_ZIP=build/misaki_bdf_2021-05-05.zip python3 -I software/micropython/tests/test_kagura_ja.py
      - name: Check MicroPython bytecode compilation
        run: |
          make -C build/micropython-src/mpy-cross -j4
          mkdir -p build/mpy
          for file in software/micropython/kagura/*.py software/micropython/kagura/ui/*.py software/micropython/kagura_ja/*.py software/micropython/examples/*.py; do
            build/micropython-src/mpy-cross/build/mpy-cross -march=armv6m -o "build/mpy/$(basename "$(dirname "$file")")-$(basename "$file").mpy" "$file"
          done
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [KAGURA_PICO, KAGURA_PICO_W, KAGURA_PICO_SHOWCASE]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and pinned MicroPython
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" submodules
          make -C build/micropython-src/mpy-cross -j4
      - name: Build USB + dupterm firmware
        run: |
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" -j4
      - name: Add the showcase ROMFS
        if: matrix.board == 'KAGURA_PICO_SHOWCASE'
        run: |
          python3 tools/make-showcase-firmware.py \
            --firmware build/micropython-src/ports/rp2/build-KAGURA_PICO_SHOWCASE/firmware.uf2 \
            --out build/micropython-src/ports/rp2/build-KAGURA_PICO_SHOWCASE/kagura-pico-showcase.uf2 \
            --romfs-py build/micropython-src/tools/mpremote/mpremote/romfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ matrix.board }}
          path: |
            build/micropython-src/ports/rp2/build-${{ matrix.board }}/firmware.uf2
            build/micropython-src/ports/rp2/build-${{ matrix.board }}/kagura-pico-showcase.uf2
            software/micropython/kagura/*.py
            software/micropython/kagura/ui/*.py
            software/micropython/kagura_ja/*.py
            software/micropython/fonts/*
            software/micropython/examples/*.py
  pico:
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
      ARM_TOOLCHAIN_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
      PICO_SDK_TAG: 2.2.0
      PICO_SDK_COMMIT: a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/opt
          key: pico-${{ env.ARM_TOOLCHAIN }}-${{ env.PICO_SDK_COMMIT }}
      - name: Install the Arm toolchain and Pico SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt
          curl -fsSL -o /tmp/arm.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$ARM_TOOLCHAIN.tar.xz"
          echo "$ARM_TOOLCHAIN_SHA256  /tmp/arm.tar.xz" | sha256sum -c
          tar -xf /tmp/arm.tar.xz -C ~/opt
          git clone --depth 1 --branch "$PICO_SDK_TAG" https://github.com/raspberrypi/pico-sdk.git ~/opt/pico-sdk
          test "$(git -C ~/opt/pico-sdk rev-parse HEAD)" = "$PICO_SDK_COMMIT"
          git -C ~/opt/pico-sdk submodule update --init --depth 1 lib/tinyusb lib/cyw43-driver
      - name: Build the host firmware
        run: |
          export PATH="$HOME/opt/$ARM_TOOLCHAIN/bin:$PATH" PICO_SDK_PATH="$HOME/opt/pico-sdk"
          cmp software/pico/pico_sdk_import.cmake "$PICO_SDK_PATH/external/pico_sdk_import.cmake"
          cmake -S software/pico -B build/pico -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pico -j"$(nproc)"
      - name: Check PIO timing against the adapter model
        run: python3 -I software/pico/tests/test_pio_timing.py build/pico/kagura_host.pio.h
      - name: Compare the C TileFramebuffer with the Python SDK
        run: python3 -I software/pico/tests/test_tile_fb.py
      - name: Check the pseudo-256-colour picture quantizer
        run: python3 -I software/pico/tests/test_img_demo.py
      - name: STARFALL host regression and SPI/QSPI builds
        run: |
          export PATH="$HOME/opt/$ARM_TOOLCHAIN/bin:$PATH" PICO_SDK_PATH="$HOME/opt/pico-sdk"
          cmake -S software/starfall -B build/starfall-host-ci -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build/starfall-host-ci -j2
          ctest --test-dir build/starfall-host-ci --output-on-failure
          for lane in spi qspi; do
            qspi=OFF
            if [ "$lane" = qspi ]; then qspi=ON; fi
            cmake -S software/starfall -B "build/starfall-$lane-ci" \
              -DSTARFALL_PICO=ON -DSTARFALL_QSPI="$qspi" -DCMAKE_BUILD_TYPE=Release \
              -Dpicotool_DIR="$PWD/build/pico/_deps/picotool"
            cmake --build "build/starfall-$lane-ci" -j2
          done
      - name: Standalone audio player (HAL, KSNG player, SRAM image)
        run: |
          export PATH="$HOME/opt/$ARM_TOOLCHAIN/bin:$PATH" PICO_SDK_PATH="$HOME/opt/pico-sdk"
          cmake -S software/audio/pico -B build/audio-pico -DCMAKE_BUILD_TYPE=Release             -Dpicotool_DIR="$PWD/build/pico/_deps/picotool"
          cmake --build build/audio-pico -j2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-firmware
          path: |
            build/pico/kagura_host.uf2
            build/pico/kagura_host.elf
            build/starfall-*-ci/starfall.uf2
            build/starfall-*-ci/starfall.elf
